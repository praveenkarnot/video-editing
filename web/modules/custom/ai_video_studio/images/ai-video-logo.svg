<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-labelledby="title desc">
  <title id="title">AI Video Studio logo</title>
  <desc id="desc">A bright play button with editing timeline and AI sparkle marks.</desc>
  <defs>
    <linearGradient id="badge" x1="22" x2="158" y1="16" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16a085"/>
      <stop offset=".56" stop-color="#4f6f8f"/>
      <stop offset="1" stop-color="#f4b942"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#10202b" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect x="18" y="18" width="144" height="144" rx="36" fill="url(#badge)" filter="url(#soft-shadow)"/>
  <circle cx="90" cy="82" r="44" fill="#fff" opacity=".95"/>
  <path d="M80 58l42 24-42 24z" fill="#10202b"/>
  <rect x="54" y="122" width="72" height="10" rx="5" fill="#10202b" opacity=".88"/>
