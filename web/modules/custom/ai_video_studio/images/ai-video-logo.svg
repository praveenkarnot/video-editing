  </rect>
  <path d="M134 44l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#fff"/>
  <path d="M48 46l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fff" opacity=".82"/>
