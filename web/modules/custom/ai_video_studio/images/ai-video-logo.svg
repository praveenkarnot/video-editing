<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
  <title id="title">AI Video Studio logo</title>
  <desc id="desc">A transparent premium AI video logo with a play lens, orbit ring, and editing timeline.</desc>
  <defs>
    <linearGradient id="mark" x1="42" x2="178" y1="38" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#11b895"/>
      <stop offset=".55" stop-color="#415f73"/>
      <stop offset="1" stop-color="#f0b83f"/>
    </linearGradient>
    <linearGradient id="lens" x1="66" x2="150" y1="62" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecf8f4"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#10202b" flood-opacity=".18"/>
    </filter>
  </defs>
  <g fill="none" filter="url(#soft)">
    <path d="M110 30c49 0 84 35 84 80s-35 80-84 80-84-35-84-80 35-80 84-80z" stroke="url(#mark)" stroke-width="10" stroke-linecap="round" stroke-dasharray="390 80">
      <animateTransform attributeName="transform" type="rotate" from="0 110 110" to="360 110 110" dur="10s" repeatCount="indefinite"/>
    </path>
    <circle cx="110" cy="102" r="54" fill="url(#lens)" stroke="rgba(16,32,43,.12)" stroke-width="2"/>
    <circle cx="110" cy="102" r="38" fill="#10202b"/>
    <path d="M99 80l42 24-42 24z" fill="#ffffff"/>
    <path d="M101 86l29 18-29 18z" fill="#f0b83f">
      <animate attributeName="opacity" values=".76;1;.76" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <rect x="62" y="158" width="96" height="12" rx="6" fill="#10202b" opacity=".9"/>
    <rect x="68" y="162" width="28" height="4" rx="2" fill="#11b895"/>
    <rect x="102" y="162" width="22" height="4" rx="2" fill="#f0b83f"/>
    <rect x="130" y="162" width="20" height="4" rx="2" fill="#ffffff" opacity=".72"/>
    <circle cx="174" cy="58" r="6" fill="#f0b83f"/>
    <path d="M55 54l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#11b895"/>
  </g>
</svg>
