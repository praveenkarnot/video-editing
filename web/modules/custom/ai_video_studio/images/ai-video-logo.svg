<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
  <title id="title">AI Video Studio logo</title>
  <desc id="desc">A premium animated AI video logo with a play lens, editing timeline, and light sparks.</desc>
  <defs>
    <linearGradient id="badge" x1="34" x2="190" y1="20" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0fb795"/>
      <stop offset=".48" stop-color="#426f9d"/>
      <stop offset="1" stop-color="#f2bd48"/>
    </linearGradient>
    <linearGradient id="glass" x1="58" x2="156" y1="44" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dff6ef"/>
    </linearGradient>
    <linearGradient id="timeline" x1="57" x2="163" y1="157" y2="157" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0fb795"/>
      <stop offset=".54" stop-color="#f2bd48"/>
      <stop offset="1" stop-color="#426f9d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="13" flood-color="#10202b" flood-opacity=".28"/>
    </filter>
    <filter id="inner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="22" y="20" width="176" height="176" rx="46" fill="url(#badge)" filter="url(#shadow)"/>
  <path d="M46 52c0-9 7-16 16-16h92c9 0 16 7 16 16v8H46z" fill="#ffffff" opacity=".18"/>
  <path d="M40 144c34 20 85 26 140-2v20c0 10-8 18-18 18H58c-10 0-18-8-18-18z" fill="#10202b" opacity=".16"/>

  <g filter="url(#inner-glow)">
    <circle cx="110" cy="98" r="58" fill="url(#glass)" opacity=".96"/>
    <circle cx="110" cy="98" r="44" fill="#10202b"/>
    <path d="M96 72l52 30-52 30z" fill="#ffffff"/>
    <path d="M99 80l37 22-37 22z" fill="#f2bd48">
      <animate attributeName="opacity" values=".82;1;.82" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <rect x="52" y="151" width="116" height="18" rx="9" fill="#ffffff" opacity=".92"/>
    <rect x="62" y="157" width="28" height="6" rx="3" fill="#10202b" opacity=".75"/>
    <rect x="96" y="157" width="30" height="6" rx="3" fill="#10202b" opacity=".45"/>
    <rect x="132" y="157" width="24" height="6" rx="3" fill="#10202b" opacity=".28"/>
    <rect x="62" y="157" width="34" height="6" rx="3" fill="url(#timeline)">
      <animate attributeName="x" values="62;118;62" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="width" values="24;42;24" dur="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g fill="#ffffff">
    <path d="M167 45l5 13 13 5-13 5-5 13-5-13-13-5 13-5z">
      <animate attributeName="opacity" values=".48;1;.48" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M50 59l3.5 9 9 3.5-9 3.5-3.5 9-3.5-9-9-3.5 9-3.5z" opacity=".82">
      <animate attributeName="opacity" values=".35;.9;.35" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="174" cy="137" r="5" opacity=".75">
      <animate attributeName="r" values="4;7;4" dur="2.7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
