<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" role="img" aria-labelledby="title">
  <title id="title">Animated upload step</title>
  <rect width="280" height="190" rx="20" fill="#edf8f5"/>
  <rect x="48" y="46" width="184" height="100" rx="18" fill="#fff" stroke="#9ccfc1" stroke-width="4" stroke-dasharray="10 8"/>
  <path d="M140 120V70m0 0l-24 24m24-24l24 24" fill="none" stroke="#16a085" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 10;0 -8;0 10" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <rect x="88" y="156" width="104" height="12" rx="6" fill="#f4b942">
    <animate attributeName="width" values="56;104;56" dur="2.6s" repeatCount="indefinite"/>
  </rect>
</svg>
