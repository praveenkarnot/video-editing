<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" role="img" aria-labelledby="title">
  <title id="title">Animated AI generation step</title>
  <rect width="280" height="190" rx="20" fill="#fff6df"/>
  <rect x="44" y="46" width="192" height="98" rx="18" fill="#fff"/>
  <path d="M96 90c18-36 70-36 88 0-18 36-70 36-88 0z" fill="#10202b"/>
  <circle cx="140" cy="90" r="18" fill="#16a085">
    <animate attributeName="r" values="12;22;12" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <g fill="#f4b942">
    <circle cx="72" cy="58" r="6">
      <animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="216" cy="62" r="8">
      <animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="212" cy="138" r="5">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="82" y="158" width="116" height="12" rx="6" fill="#16a085">
    <animate attributeName="width" values="44;116;44" dur="2.5s" repeatCount="indefinite"/>
  </rect>
</svg>
