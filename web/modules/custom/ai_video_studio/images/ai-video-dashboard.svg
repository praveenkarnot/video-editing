<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">AI video editing dashboard preview</title>
  <desc id="desc">A colorful animated dashboard showing a video preview, timeline, and AI generation panel.</desc>
  <defs>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#263447"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#16a085"/>
      <stop offset="1" stop-color="#f4b942"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#10202b" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="760" height="520" rx="38" fill="#eef6f4"/>
  <g filter="url(#shadow)">
    <rect x="70" y="66" width="620" height="388" rx="24" fill="#fff"/>
    <rect x="98" y="100" width="390" height="220" rx="18" fill="url(#screen)"/>
    <path d="M266 168l92 54-92 54z" fill="#f4b942"/>
    <rect x="520" y="100" width="134" height="24" rx="12" fill="#d9eee8"/>
    <rect x="520" y="140" width="112" height="16" rx="8" fill="#bfdad2"/>
    <rect x="520" y="172" width="96" height="16" rx="8" fill="#bfdad2"/>
    <rect x="520" y="214" width="134" height="54" rx="16" fill="#10202b"/>
    <text x="540" y="248" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="700">AI Render</text>
    <rect x="98" y="352" width="556" height="18" rx="9" fill="#dce6ea"/>
    <rect x="98" y="352" width="258" height="18" rx="9" fill="url(#accent)">
      <animate attributeName="width" values="120;420;258;120" dur="5s" repeatCount="indefinite"/>
    </rect>
    <g>
      <rect x="110" y="392" width="86" height="28" rx="8" fill="#16a085"/>
      <rect x="210" y="392" width="134" height="28" rx="8" fill="#f4b942"/>
      <rect x="358" y="392" width="106" height="28" rx="8" fill="#4f6f8f"/>
      <rect x="478" y="392" width="74" height="28" rx="8" fill="#16a085"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;18 0;0 0" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
